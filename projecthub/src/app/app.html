
<main class="dashboard">
  <header class="header">
    <div>
      <h1>{{ title }}</h1>
      <p>Manage your projects and tasks in one place.</p>
    </div>

    <span class="header-label">Task Manager</span>
  </header>

  <app-task-summary
    [totalTasks]="totalTasks"
    [pendingTasks]="pendingTasks"
    [completedTasks]="completedTasks"
  />

  <section class="add-task-panel">
    <h2>Add a Task</h2>

    <form class="task-form" (ngSubmit)="addTask()">
      <input
        type="text"
        name="taskTitle"
        [(ngModel)]="newTaskTitle"
        placeholder="Enter a task name"
        aria-label="Task name"
        required
      />

      <button
        type="submit"
        [disabled]="!newTaskTitle.trim()"
      >
        Add task
      </button>
    </form>
  </section>

  <app-task-list
    [tasks]="tasks"
    (taskToggled)="toggleTask($event)"
    (taskDeleted)="deleteTask($event)"
  />
</main>
