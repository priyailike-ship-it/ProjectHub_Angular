
<div class="task-item">
  <label class="task-description">
    <input
      type="checkbox"
      [checked]="task.completed"
      (change)="OnToggle()"
    />

    <span [class.completed]="task.completed">
      {{ task.title }}
    </span>
  </label>

  <button
    type="button"
    class="delete-button"
    (click)="OnDelete()"
    [attr.aria-label]="'Delete ' + task.title"
  >
    Delete
  </button>
</div>
